[project]
name = "mama"
version = "0.2.0"
description = "Dados públicos sobre câncer de mama no Brasil (TCC Ilum/CNPEM)"
requires-python = ">=3.11"
dependencies = [
    "datasus-dbc==0.1.3",
    "dbfread==2.0.7",
    "geopandas==1.2.0",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "pyarrow==26.0.0",
    "pyogrio",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "jupyter==1.1.1", "ipykernel==7.4.0", "nbformat", "nbconvert"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
